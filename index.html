<!doctype html>

<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#0B0B0B" />

  <!-- Tampilan awal sebelum JavaScript siap: animasi loading merah profesional -->
  <style>
    html, body { background: #0B0B0B; margin: 0; padding: 0; }
    #boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    #boot i { width: 34px; height: 34px; border: 3px solid #D90429; border-top-color: transparent; border-radius: 50%; animation: boot-spin .75s linear infinite; display: inline-block; }
    #boot span { font-size: 13px; font-weight: 500; color: #a1a1aa; letter-spacing: 0.02em; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>

  <!-- SEO Meta Tags -->
  <title>SnapHub — Sewa Photobooth Premium | Capture Every Smile</title>
  <meta name="description"
    content="SnapHub menyediakan layanan sewa photobooth premium untuk pernikahan, wisuda, ulang tahun, dan lebih. Cetak instan, galeri digital, kru profesional. Booking via WhatsApp sekarang!" />
  <meta name="keywords"
    content="malang, photobooth malang, photobooth, sewa photobooth, photobooth pernikahan, photobooth ulang tahun, photobooth wisuda, SnapHub" />
  <meta name="author" content="SnapHub" />
  <meta name="robots" content="index, follow" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://snaphub.my.id" />

  <!-- Open Graph -->
  <meta property="og:title" content="SnapHub — Sewa Photobooth Premium Malang" />
  <meta property="og:description"
    content="Abadikan setiap senyum dan ciptakan kenangan bersama SnapHub. Photobooth premium untuk pernikahan, wisuda, ulang tahun & acara korporat." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://snaphub.my.id" />
  <meta property="og:image" content="https://snaphub.my.id/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="SnapHub Premium Photobooth Services" />
  <meta property="og:locale" content="id_ID" />
  <meta property="og:site_name" content="SnapHub" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SnapHub — Sewa Photobooth Premium Malang" />
  <meta name="twitter:description" content="Photobooth premium untuk setiap acara spesial. Booking via WhatsApp!" />
  <meta name="twitter:image" content="https://snaphub.my.id/og-image.png" />
  <meta name="twitter:image:alt" content="SnapHub Premium Photobooth Services" />

  <!-- Font di-host sendiri (@fontsource), tanpa stylesheet pihak ketiga yang memblokir tampilan -->

  <!-- Koneksi ke Supabase disiapkan lebih awal -->
  <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

  <!-- Halaman live customer: minta data segera, paralel dengan unduhan JavaScript -->
  <script>
    (function () {
      var isLiveHost = location.hostname === 'live.snaphub.my.id' || location.hostname.startsWith('live.');
      var m = isLiveHost
        ? location.pathname.match(/^\/([^/]+)/)
        : location.pathname.match(/^\/live\/([^/]+)/);
      if (!m || !m[1]) return;
      var token = m[1].split('-').pop();
      var p = fetch('%VITE_SUPABASE_URL%/rest/v1/rpc/get_live_event', {
        method: 'POST',
        headers: {
          apikey: '%VITE_SUPABASE_ANON_KEY%',
          Authorization: 'Bearer %VITE_SUPABASE_ANON_KEY%',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ p_token: token })
      }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      window.__live = { token: token, promise: p };
    })();
  </script>

  <!-- Halaman antrian tamu: minta data segera, paralel dengan unduhan JavaScript & font -->
  <script>
    (function () {
      try {
        var isQHost = location.hostname === 'queue.snaphub.my.id' || location.hostname.startsWith('queue.');
        var m = isQHost
          ? location.pathname.match(/^\/([^/]+)/)
          : location.pathname.match(/^\/queue\/([^/]+)/);
        if (!m || !m[1]) return;
        var slug = m[1];
        if (slug === 'display' || slug === 'qr' || slug.endsWith('/display') || slug.endsWith('/qr')) return;
        var token = slug.split('-').pop();
        if (!token) return;

        var savedTicket = null;
        try { savedTicket = localStorage.getItem('snaphub_ticket_' + token); } catch (e) {}

        var p = fetch('%VITE_SUPABASE_URL%/rest/v1/rpc/get_queue_state', {
          method: 'POST',
          headers: {
            apikey: '%VITE_SUPABASE_ANON_KEY%',
            Authorization: 'Bearer %VITE_SUPABASE_ANON_KEY%',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ p_token: token, p_ticket_id: savedTicket || null })
        }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
        window.__queuePreload = { token: token, ticketId: savedTicket, promise: p };
      } catch (e) {}
    })();
  </script>

  <!-- Theme color -->
  <meta name="theme-color" content="#0B0B0B" />
