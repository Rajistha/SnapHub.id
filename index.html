  <!-- Deteksi rute antrian tamu lebih awal agar App Shell langsung aktif pada first paint -->
  <script>
    (function () {
      try {
        var h = location.hostname;
        var p = location.pathname;
        var isQ = h === 'queue.snaphub.my.id' || h.startsWith('queue.') || p.indexOf('/queue') === 0;
        var isDisplay = p.indexOf('/display') !== -1 || p.indexOf('/qr') !== -1;
        if (isQ && !isDisplay) {
          document.documentElement.classList.add('is-queue-guest');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tampilan awal sebelum JavaScript siap: tidak lagi layar hitam kosong -->

    html, body { background: #0B0B0B; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
    #boot-default { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    #boot-default i { width: 32px; height: 32px; border: 3px solid #D90429; border-top-color: transparent; border-radius: 50%; animation: boot-spin .8s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }

    /* App Shell Instan untuk Halaman Antrian Tamu */
    #boot-queue { display: none; min-height: 100vh; min-height: 100dvh; flex-direction: column; position: relative; overflow-x: hidden; background: #0b0b0c; }
    html.is-queue-guest #boot-default { display: none !important; }
    html.is-queue-guest #boot-queue { display: flex !important; }

    .q-glow { position: absolute; top: -128px; left: 50%; transform: translateX(-50%); width: 28rem; height: 28rem; border-radius: 50%; background: rgba(217,4,41,0.25); filter: blur(110px); pointer-events: none; }
    .q-hdr { position: relative; padding: max(0.9rem, env(safe-area-inset-top, 16px)) 20px 0; display: flex; justify-content: space-between; align-items: center; }
    .q-btn-audio { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 9999px; font-size: 12px; color: #e4e4e7; }
    .q-main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px 20px max(3rem, env(safe-area-inset-bottom, 32px)); gap: 20px; max-width: 440px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    .q-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .q-badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(217,4,41,0.4); background: rgba(217,4,41,0.15); padding: 4px 12px; border-radius: 9999px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #fecdd3; }
    .q-dot { width: 6px; height: 6px; border-radius: 50%; background: #fb7185; }
    .q-title { font-size: clamp(1.35rem, 4.4vh, 2rem); font-weight: 800; line-height: 1.1; margin: 0; color: #ffffff; letter-spacing: -0.02em; }
    .q-line { width: 48px; height: 4px; border-radius: 9999px; background: #D90429; margin: 4px auto 8px; }
    .q-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; }
    .q-stat { border-radius: 16px; padding: 10px 4px; text-align: center; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); }
    .q-stat-hi { border-color: rgba(217,4,41,0.5); background: rgba(217,4,41,0.15); }
    .q-stat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #a1a1aa; margin-bottom: 4px; }
    .q-stat-val { font-size: 18px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: #fff; }
    
    .q-card { width: 100%; box-sizing: border-box; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); background: linear-gradient(to bottom, #1b1b1f, #121214); padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .q-card-title { font-size: clamp(1.15rem, 3vh, 1.45rem); font-weight: 700; margin: 0; color: #fff; }
    .q-card-desc { font-size: 12px; color: #a1a1aa; margin: 6px 0 0; line-height: 1.4; }
    .q-take-btn { width: 100%; margin-top: 20px; box-sizing: border-box; border: none; border-radius: 12px; background: #D90429; color: #fff; padding: 16px 20px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 25px rgba(217,4,41,0.35); cursor: pointer; transition: transform 0.1s ease; }

  <!-- Halaman live customer: minta data segera, paralel dengan unduhan JavaScript -->
  <script>
    (function () {
      var isLiveHost = location.hostname === 'live.snaphub.my.id' || location.hostname.startsWith('live.');
      var m = isLiveHost
        ? location.pathname.match(/^\/([^/]+)/)
        : location.pathname.match(/^\/live\/([^/]+)/);
      if (!m || !m[1]) return;
      var token = m[1].split('-').pop();
      var p = fetch('%VITE_SUPABASE_URL%/rest/v1/rpc/get_live_event', {
        method: 'POST',
        headers: {
          apikey: '%VITE_SUPABASE_ANON_KEY%',
          Authorization: 'Bearer %VITE_SUPABASE_ANON_KEY%',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ p_token: token })
      }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      window.__live = { token: token, promise: p };
    })();
  </script>

  <!-- Halaman antrian tamu: klaim atau ambil data antrian segera, paralel dengan unduhan JavaScript & font -->
  <script>
    (function () {
      try {
        var isQHost = location.hostname === 'queue.snaphub.my.id' || location.hostname.startsWith('queue.');
        var m = isQHost
          ? location.pathname.match(/^\/([^/]+)/)
          : location.pathname.match(/^\/queue\/([^/]+)/);
        if (!m || !m[1]) return;
        var slug = m[1];
        if (slug === 'display' || slug === 'qr' || slug.endsWith('/display') || slug.endsWith('/qr')) return;
        var gate = slug.split('-').pop();
        if (!gate) return;

        var savedSession = null;
        try { savedSession = localStorage.getItem('snaphub_entry_' + gate); } catch (e) {}

        var url, body;
        if (savedSession) {
          url = '%VITE_SUPABASE_URL%/rest/v1/rpc/get_entry_state';
          body = JSON.stringify({ p_session: savedSession });
        } else {
          url = '%VITE_SUPABASE_URL%/rest/v1/rpc/queue_claim_gate';
          body = JSON.stringify({ p_gate: gate });
        }

        var p = fetch(url, {
          method: 'POST',
          headers: {
            apikey: '%VITE_SUPABASE_ANON_KEY%',
            Authorization: 'Bearer %VITE_SUPABASE_ANON_KEY%',
            'Content-Type': 'application/json'
          },
          body: body
        }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
        window.__queuePreload = { gate: gate, session: savedSession, promise: p };
      } catch (e) {}
    })();
  </script>
